<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GyroVR · 최범수 프로젝트 상세</title>
<meta name="description" content="GyroVR 차량 경로 추종, 주행 문제 해결과 시퀀서 연출 상세">

<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/style.css">
<link rel="stylesheet" href="../../assets/css/motion.css">
<link rel="stylesheet" href="../../assets/css/media.css">
<!--
  ============================================================
  파일 구성
    assets/js/content.js   내용 (여기만 고치면 됩니다)
    assets/js/app.js       내용 → 화면 렌더러, 목차·테마·PDF 기능
    assets/js/motion.js    스크롤 등장, 접기/펼치기, JS 애니메이션 등록
    assets/css/tokens.css  색·간격·모션 속도 값
    assets/css/style.css   레이아웃·컴포넌트
    assets/css/motion.css  등장 효과 프리셋
  사진: 이 파일 옆에 portrait.jpg 를 두면 표시됩니다.
  ============================================================
-->
<script>
  try {
    var savedTheme = localStorage.getItem('portfolio-theme');
    if (savedTheme === 'light' || savedTheme === 'dark') document.documentElement.setAttribute('data-theme', savedTheme);
  } catch (e) {}
</script>
</head>
<body>

<div class="toolbar">
  <button class="tool-btn toc-btn" id="tocBtn" type="button" aria-expanded="false" aria-controls="toc">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M2.5 4h11M2.5 8h11M2.5 12h7"/></svg>
    목차
  </button>
  <button class="tool-btn" id="pdfBtn" type="button">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.5v7.5M4.75 6.75 8 10l3.25-3.25M3 13.5h10"/></svg>
    PDF
  </button>
  <button class="tool-btn" id="themeBtn" type="button" aria-label="테마 전환">
    <svg class="i-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M13.5 9.6A5.6 5.6 0 1 1 6.4 2.5a4.4 4.4 0 0 0 7.1 7.1Z"/></svg>

    <span class="t-dark">Dark</span><span class="t-light">Light</span>
  </button>
</div>

<nav class="toc" id="toc" aria-label="목차">
  <p class="toc-label">Contents</p>
  <ul id="tocList"></ul>
</nav>

<main class="sheet" id="app">
  <noscript><p class="noscript">이 페이지는 JavaScript 를 켜야 내용이 보입니다.</p></noscript>
</main>

<script src="../../assets/js/gyrovr-detail.js"></script>
<script src="../../assets/js/motion.js"></script>
<script src="../../assets/js/app.js"></script>

<script src="../../assets/js/media.js"></script>
<script>App.render();</script>
